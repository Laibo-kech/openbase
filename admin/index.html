<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多维数据库管理后台</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
  <main id="login" class="login-shell">
    <section class="login-panel">
      <div class="brand-mark">DB</div>
      <h1>多维数据库管理后台</h1>
      <p>系统管理员登录</p>
      <form id="login-form">
        <label>管理员账号<input id="login-username" autocomplete="username" required /></label>
        <label>管理员密码<input id="login-password" type="password" autocomplete="current-password" required /></label>
        <div id="login-error" class="error-message"></div>
        <button class="primary" type="submit">登录管理后台</button>
      </form>
    </section>
  </main>

  <div id="app" class="app-shell" hidden>
    <aside>
      <div class="admin-brand"><span>DB</span><strong>系统管理</strong></div>
      <nav>
        <button class="active" data-page="overview">系统概览</button>
        <button data-page="users">账号管理</button>
        <button data-page="projects">项目统计</button>
        <button data-page="audit">审计记录</button>
      </nav>
      <button id="logout" class="logout">退出登录</button>
    </aside>
    <section class="workspace">
      <header>
        <div><h1 id="page-title">系统概览</h1><p id="page-subtitle">运行状态与容量</p></div>
        <div class="admin-name"><span id="admin-name"></span><i></i></div>
      </header>
      <div id="content" class="content"></div>
    </section>
  </div>

  <div id="modal" class="modal-backdrop" hidden>
    <section class="modal">
      <header><h2 id="modal-title"></h2><button id="modal-close" aria-label="关闭">×</button></header>
      <form id="modal-form">
        <div id="modal-fields"></div>
        <div id="modal-error" class="error-message"></div>
        <footer><button type="button" id="modal-cancel">取消</button><button class="primary" type="submit">确认</button></footer>
      </form>
    </section>
  </div>
  <script type="module" src="/admin.js"></script>
</body>
</html>
