services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: openbase_lookup_candidate
      POSTGRES_USER: openbase_lookup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - lookup_candidate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbase_lookup -d openbase_lookup_candidate"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: openbase-lookup:candidate
    restart: unless-stopped
    environment:
      PORT: 14280
      DATABASE_URL: postgres://openbase_lookup:${POSTGRES_PASSWORD}@db:5432/openbase_lookup_candidate
      NODE_ENV: production
      SEED_DEMO: "false"
      LOOKUP_WORKER_INTERVAL_MS: 100
    ports:
      - "127.0.0.1:14280:14280"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:14280/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  lookup_candidate_pgdata:
